# adapters/opencode/config/models.conf
# OpenCode adapter — the SOLE declaration of concrete OpenCode model IDs
# (provider/model-id) and variants. role-map.sh derives from this file. A
# concrete model ID outside this file (and generated regions) is a fail-closed
# guard violation (tools/check-model-config.py).
#
# Runtime env vars still override (AGENT_MODEL_FAST/BALANCED/DEEP,
# AGENT_VARIANT_*); this file is the default source. OpenCode uses a
# provider/model-id string plus a variant field (no numeric reasoning effort).
# Verified against the local opencode-go provider registry (opencode 1.17.13).
# Tuning preference: prefer changing an effort/variant tier over a model tier.

# --- Tiers: concrete provider/model-id + variant ---
# glm-5.2 sits at the balanced-deep tier. The deep tier is intentionally
# vacant (no distinct deep-effort model verified for opencode-go yet); a
# `deep` profile request demotes to balanced-deep and records that in
# CFG_MODEL_PROFILE_GRANULARITY_DEEP below (not fail-closed).
CFG_TIER_BALANCED_DEEP_MODEL=opencode-go/glm-5.2
CFG_TIER_BALANCED_DEEP_VARIANT=runtime-default
CFG_TIER_LIGHT_MODEL=opencode-go/deepseek-v4-pro
CFG_TIER_LIGHT_VARIANT=runtime-default
CFG_TIER_MINI_MODEL=opencode-go/deepseek-v4-flash
CFG_TIER_MINI_VARIANT=runtime-default

# --- Portable execution profiles (tier:variant), SD-88. deep demotes to
#     balanced-deep (deep tier is vacant, see above); the demotion is
#     recorded per-profile in CFG_MODEL_PROFILE_GRANULARITY_DEEP. ---
CFG_MODEL_PROFILE_DEEP=balanced-deep:runtime-default
CFG_MODEL_PROFILE_BALANCED_DEEP=balanced-deep:runtime-default
CFG_MODEL_PROFILE_LIGHT=light:runtime-default
CFG_MODEL_PROFILE_MINI=mini:runtime-default
CFG_MODEL_PROFILE_GRANULARITY=exact
CFG_MODEL_PROFILE_GRANULARITY_DEEP=deep-vacant-demoted-to-balanced-deep

# --- deep-tier capacity failover (model-granularity): glm-5.2 exhausted ->
#     deepseek-v4-pro. Key name and values are unchanged even though the
#     deep tier is vacant — SD-59 capacity_cascade_next
#     (utilities/stage-dispatch-fallback.py) reads this literal key name
#     hard-coded and is harness-agnostic; renaming it would silently break
#     capacity failover. Consumed by SD-59 capacity_cascade_next. ---
CFG_TIER_DEEP_FAILOVER=light
CFG_TIER_DEEP_FAILOVER_CASCADE="opencode-go/glm-5.2:runtime-default opencode-go/deepseek-v4-pro:runtime-default"

# --- OpenCode bucket -> tier mapping is retained for non-route role selection.
#     Registered topology never infers a profile from these buckets. ---

# --- Native subagent type catalog (agent-name:portable-profile) ---
# Cross-harness parity with the Claude catalog (same names, same portable
# profiles, resolved through this adapter's CFG_MODEL_PROFILE_* rows by
# sync-native-agents.py; the variant axis stays runtime-default).
CFG_NATIVE_AGENT_CATALOG="general-purpose:balanced-deep light:light deep:deep"
